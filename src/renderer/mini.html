<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Ferna Pomoro mini</title>
    <style>
      :root {
        --accent: #e0483f;
        --clock: 30px;
        --label: 10px;
        --btn: 11px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: #e7ebf3;
        user-select: none;
        overflow: hidden;
      }
      body[data-size="small"] {
        --clock: 24px;
        --label: 9px;
        --btn: 10px;
      }
      body[data-size="large"] {
        --clock: 38px;
        --label: 11px;
        --btn: 12px;
      }
      .mini {
        height: 100%;
        margin: 5px;
        border-radius: 13px;
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c3342;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        display: grid;
        grid-template-rows: auto auto auto 1fr auto;
        padding: 6px 10px 8px;
        -webkit-app-region: drag;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: var(--label);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #98a2b8;
        min-height: 15px;
      }
      .pip {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      #phase {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .now {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: #c3cbdb;
      }
      .wbtn {
        -webkit-app-region: no-drag;
        border: 0;
        background: transparent;
        color: #98a2b8;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        padding: 2px 3px;
        border-radius: 5px;
      }
      .wbtn:hover {
        background: #212633;
        color: #e7ebf3;
      }
      .clock {
        font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: var(--clock);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .task {
        font-size: calc(var(--label) + 1px);
        color: #9aa5ba;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: #212633;
        overflow: hidden;
        margin: 5px 0 6px;
        align-self: end;
      }
      .fill {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.4s linear;
      }
      .row {
        display: flex;
        gap: 5px;
        -webkit-app-region: no-drag;
      }
      button.act {
        flex: 1;
        border: 1px solid #2c3342;
        background: #212633;
        color: #e7ebf3;
        border-radius: 7px;
        padding: 4px 0;
        font-size: var(--btn);
        font-family: inherit;
        cursor: pointer;
      }
      button.act:hover {
        filter: brightness(1.2);
      }
      .primary {
        background: var(--accent);
        border-color: transparent;
        font-weight: 600;
      }
      .hidden {
        display: none !important;
      }

      /* ------------------------------------------- the ultra-compact overlay
         Nothing but the countdown and the time of day, for sitting over a
         full-screen window. The whole page is zoomed by the main process, so
         every size here is in "100%" units and scales together. */
      .compact {
        display: none;
        height: 100%;
        margin: 4px;
        border-radius: 11px;
        background: rgba(18, 20, 26, 0.92);
        border: 1px solid #2c3342;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
        -webkit-app-region: drag;
        position: relative;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      body[data-compact="1"] .compact {
        display: flex;
      }
      body[data-compact="1"] .mini {
        display: none;
      }
      body[data-compact="1"][data-layout="vertical"] .compact {
        flex-direction: column;
        gap: 1px;
      }
      body[data-compact="1"][data-layout="horizontal"] .compact {
        flex-direction: row;
        gap: 10px;
        padding: 0 12px;
      }
      .c-focus {
        font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #f2f5fa;
      }
      body[data-layout="horizontal"] .c-focus {
        font-size: 26px;
      }
      .c-now {
        font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: 15px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #9aa5ba;
        white-space: nowrap;
      }
      body[data-layout="horizontal"] .c-now {
        font-size: 14px;
      }
      /* A hairline in the phase colour, so a glance also says focus or break. */
      .c-edge {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: var(--accent);
        opacity: 0.9;
      }
      .c-tools {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: rgba(14, 16, 21, 0.93);
        opacity: 0;
        transition: opacity 0.12s ease;
        -webkit-app-region: no-drag;
      }
      .compact:hover .c-tools {
        opacity: 1;
      }
      .c-tools button {
        font-family: inherit;
        font-size: 13px;
        line-height: 1;
        color: #e7ebf3;
        background: #212633;
        border: 1px solid #2c3342;
        border-radius: 6px;
        padding: 5px 8px;
        cursor: pointer;
      }
      .c-tools button:hover {
        filter: brightness(1.25);
      }
    </style>
  </head>
  <body data-size="medium">
    <div class="mini">
      <div class="top">
        <span class="pip" id="pip"></span>
        <span id="phase">Ready</span>
        <span class="now" id="now"></span>
        <button class="wbtn hidden" id="min" title="Minimise">–</button>
        <button class="wbtn" id="close" title="Hide mini timer">✕</button>
      </div>
      <div class="clock" id="clock">25:00</div>
      <div class="task" id="task"></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="row">
        <button class="act primary" id="toggle">Start</button>
        <button class="act" id="skip">Skip</button>
        <button class="act" id="open">Open</button>
      </div>
    </div>
    <div class="compact" id="compact">
      <span class="c-focus" id="c-focus">25:00</span>
      <span class="c-now" id="c-now">00:00</span>
      <div class="c-edge"></div>
      <div class="c-tools" id="c-tools">
        <button id="c-toggle" title="Start / pause">▶</button>
        <button id="c-open" title="Open Ferna Pomoro">▣</button>
        <button id="c-close" title="Hide the overlay">✕</button>
      </div>
    </div>

    <script src="mini.js"></script>
  </body>
</html>
