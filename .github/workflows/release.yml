# Builds the Windows installer on GitHub's own Windows runners and attaches it
# to the release. Push a tag (v1.1.1) and the installer appears under Releases
# a few minutes later — no local build, no splitting files to share them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.1.1)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer and portable build
        run: npm run dist

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Tee-Object -Append -FilePath dist/SHA256SUMS.txt
          }

      - name: Publish to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          $assets = @(Get-ChildItem dist/*.exe, dist/SHA256SUMS.txt | ForEach-Object { $_.FullName })
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Ferna Pomoro $tag" --notes "Installer and portable build are attached below. See CHANGELOG.md for what changed in this version."
          }
          gh release upload $tag $assets --clobber
